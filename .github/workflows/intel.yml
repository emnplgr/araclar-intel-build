name: Araclar Intel build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Derlenecek kaynak sürümü (tag)"
        default: "v3.4.5"
        required: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v4
        with:
          repository: vorssaint/vorssaint-utils
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Intel (x86_64) için yamala
        run: |
          sed -i '' 's/^TARGET="arm64-apple-macosx14.0"/TARGET="x86_64-apple-macosx14.0"/' build.sh
          sed -i '' 's|^"build/\$FAN_HELPER_ID" --selftest$|"build/$FAN_HELPER_ID" --selftest \|\| echo "fan helper selftest atlandi"|' build.sh
          grep -n 'x86_64-apple-macosx14.0' build.sh
          chmod +x build.sh Tests/*.sh Tools/*.sh

      - name: Hafif varsayılan özellikler
        run: |
          python3 - <<'PY'
          p = 'Sources/Vorssaint/Core/FeatureCatalog.swift'
          s = open(p, encoding='utf-8').read()
          old = "    var installedByDefault: Bool {\n        switch self {"
          assert old in s
          new = ("    var installedByDefault: Bool {\n"
                 "        switch self {\n"
                 "        case .switcher, .clipboardHistory, .pastePlain, .keepAwake, .commandBar, .micMute,\n"
                 "             .screenshot, .cameraPreview, .windowMaximizer, .windowLayout:\n"
                 "            return true\n"
                 "        default:\n"
                 "            return false\n"
                 "        }\n"
                 "    }\n\n"
                 "    var originalInstalledByDefault: Bool {\n"
                 "        switch self {")
          open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
          PY
          grep -n 'originalInstalledByDefault' Sources/Vorssaint/Core/FeatureCatalog.swift

      - name: Derle
        run: ./build.sh

      - name: Mimariyi doğrula
        run: |
          APP="build/stage/Vorssaint.app"
          for f in "$APP"/Contents/MacOS/*; do
            echo "$f -> $(lipo -archs "$f")"
          done
          lipo -archs "$APP"/Contents/MacOS/Vorssaint | grep -q x86_64

      - name: Simgeleri üret
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q pillow
          mkdir -p assets
          .venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import math
          S = 4096

          def gear(fg, teeth=8, r_out=0.46, r_in=0.36, r_hole=0.16, tooth_w=0.55):
              im = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              c = S / 2
              pts = []
              step = 2 * math.pi / teeth
              w = step * tooth_w / 2
              for i in range(teeth):
                  a = step * i
                  for da, r in ((-step / 2, r_in), (-w * 0.8, r_out), (w * 0.8, r_out), (step / 2, r_in)):
                      pts.append((c + math.cos(a + da) * r * S, c + math.sin(a + da) * r * S))
              d.polygon(pts, fill=fg)
              k = r_in * S * 0.97
              d.ellipse([c - k, c - k, c + k, c + k], fill=fg)
              h = r_hole * S
              d.ellipse([c - h, c - h, c + h, c + h], fill=(0, 0, 0, 0))
              return im

          W = 1024
          base = Image.new('RGBA', (W, W), (0, 0, 0, 0))
          g = Image.new('RGBA', (W, W))
          gp = g.load()
          for y in range(W):
              t = y / W
              col = tuple(int((64, 156, 255)[i] * (1 - t) + (10, 84, 214)[i] * t) for i in range(3)) + (255,)
              for x in range(W):
                  gp[x, y] = col
          mask = Image.new('L', (W * 2, W * 2), 0)
          ImageDraw.Draw(mask).rounded_rectangle([200, 200, 2 * W - 200, 2 * W - 200], radius=370, fill=255)
          base.paste(g, (0, 0), mask.resize((W, W), Image.LANCZOS))
          gr = gear((255, 255, 255, 255), r_out=0.30, r_in=0.235, r_hole=0.105).resize((W, W), Image.LANCZOS)
          sh = Image.new('RGBA', (W, W), (0, 0, 0, 0))
          sh.putalpha(gr.split()[3].point(lambda v: int(v * 0.25)))
          sh = sh.filter(ImageFilter.GaussianBlur(10))
          sh2 = Image.new('RGBA', (W, W), (0, 0, 0, 0))
          sh2.paste(sh, (0, 12))
          base = Image.alpha_composite(Image.alpha_composite(base, sh2), gr)
          base.save('assets/icon-1024.png')

          mb = gear((0, 0, 0, 255), r_out=0.47, r_in=0.37, r_hole=0.16)
          mb.resize((18, 18), Image.LANCZOS).save('assets/MenuBarIcon.png')
          mb.resize((36, 36), Image.LANCZOS).save('assets/MenuBarIcon@2x.png')
          mb.resize((128, 128), Image.LANCZOS).save('assets/BrandMark.png')
          PY
          mkdir -p assets/AppIcon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon-1024.png --out assets/AppIcon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon-1024.png --out assets/AppIcon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns assets/AppIcon.iconset -o assets/AppIcon.icns
          ls -la assets

      - name: Adı ve simgeyi değiştir
        run: |
          mkdir -p out
          DEST="out/Araçlar.app"
          rm -rf "$DEST"
          ditto "build/stage/Vorssaint.app" "$DEST"
          R="$DEST/Contents/Resources"
          cp assets/AppIcon.icns "$R/AppIcon.icns"
          cp assets/MenuBarIcon.png assets/MenuBarIcon@2x.png assets/BrandMark.png "$R/"
          rm -f "$R/Assets.car"
          PB=/usr/libexec/PlistBuddy
          P="$DEST/Contents/Info.plist"
          $PB -c "Delete :CFBundleIconName" "$P" || true
          $PB -c "Set :CFBundleName Araçlar" "$P"
          if $PB -c "Print :CFBundleDisplayName" "$P" >/dev/null 2>&1; then
            $PB -c "Set :CFBundleDisplayName Araçlar" "$P"
          else
            $PB -c "Add :CFBundleDisplayName string Araçlar" "$P"
          fi
          xattr -cr "$DEST"
          codesign --force --deep --sign - "$DEST"
          codesign --verify --deep --strict "$DEST"
          ditto -c -k --keepParent "$DEST" "out/Araclar-intel.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Araclar-intel
          path: out/Araclar-intel.zip
